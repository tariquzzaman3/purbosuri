name: Deploy to Firebase

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Stored in GitHub: Settings > Secrets and variables > Actions. Never in the repo.
      SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check deploy credentials
        id: creds
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret is not set. Skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build web app
        if: steps.creds.outputs.ready == 'true'
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Deploy rules and hosting
        if: steps.creds.outputs.ready == 'true'
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy --only firestore:rules,hosting --project purbosuri --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
